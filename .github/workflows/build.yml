
name: Build AICompany APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: build-aicompany
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      LLAMA_REF: b8683
      NDK_VERSION: 29.0.13113456
      CMAKE_VERSION: 3.31.6
      APK_NAME: AICompany-debug.apk
      MIN_SDK: '26'
      TARGET_SDK: '28'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Locate project directory
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$GITHUB_WORKSPACE/app/build.gradle.kts" ]]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          elif [[ -f "$GITHUB_WORKSPACE/AICompany/app/build.gradle.kts" ]]; then
            PROJECT_DIR="$GITHUB_WORKSPACE/AICompany"
          else
            echo "::error::Could not locate AICompany Android project"
            find "$GITHUB_WORKSPACE" -maxdepth 4 -name build.gradle.kts -print
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Validate proot download URL
        env:
          PROOT_DEB_URL: ${{ vars.PROOT_DEB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$PROOT_DEB_URL" ]]; then
            echo "::error::Set PROOT_DEB_URL in repository variables"
            exit 1
          fi
          if [[ "$PROOT_DEB_URL" != https://* ]]; then
            echo "::error::PROOT_DEB_URL must use HTTPS"
            exit 1
          fi

      - name: Download proot native binaries
        env:
          PROOT_DEB_URL: ${{ vars.PROOT_DEB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          WORK=/tmp/proot-package
          rm -rf "$WORK"
          mkdir -p "$WORK"
          cd "$WORK"

          curl --fail --location --retry 5 \
            --retry-all-errors --connect-timeout 20 \
            "$PROOT_DEB_URL" -o proot.deb

          ar t proot.deb | grep -q '^data.tar' || {
            echo "::error::Invalid Debian package"
            exit 1
          }

          ar x proot.deb
          DATA=$(find . -maxdepth 1 -name 'data.tar.*' -print -quit)
          test -n "$DATA"
          tar -xf "$DATA"

          BIN=$(find . -path '*/usr/bin/proot' -type f -print -quit)
          LOADER=$(find . -path '*/usr/libexec/proot/loader' -type f -print -quit)

          test -n "$BIN" || {
            echo "::error::proot executable missing"
            exit 1
          }

          test -n "$LOADER" || {
            echo "::error::proot loader missing"
            exit 1
          }

          JNI="$PROJECT_DIR/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$JNI"

          cp "$BIN" "$JNI/libproot.so"
          cp "$LOADER" "$JNI/libproot-loader.so"

          chmod 755 "$JNI/libproot.so" "$JNI/libproot-loader.so"
          file "$JNI/libproot.so" "$JNI/libproot-loader.so"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;${CMAKE_VERSION}" \
            "ndk;${NDK_VERSION}"

      - name: Fetch llama.cpp
        shell: bash
        run: |
          set -euo pipefail

          DEST="$PROJECT_DIR/app/src/main/cpp/llama.cpp"

          rm -rf "$DEST"

          git clone --depth 1 \
            --branch "$LLAMA_REF" \
            https://github.com/ggml-org/llama.cpp \
            "$DEST"

          test -f "$DEST/include/llama.h"

          echo "LLAMA_SHA=$(git -C "$DEST" rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"

      - name: Verify Android project and resources
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          grep -q "minSdk = ${MIN_SDK}" app/build.gradle.kts
          grep -q "targetSdk = ${TARGET_SDK}" app/build.gradle.kts
          grep -q "arm64-v8a" app/build.gradle.kts

          test -s app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -s app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          test -s app/src/main/AndroidManifest.xml

          echo "Android project checks passed"

      - name: Run tests and build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          APK=app/build/outputs/apk/debug/app-debug.apk

          test -s "$APK"
          unzip -tq "$APK"

          mkdir -p "$GITHUB_WORKSPACE/dist"

          cp "$APK" "$GITHUB_WORKSPACE/dist/$APK_NAME"

          sha256sum "$GITHUB_WORKSPACE/dist/$APK_NAME" \
            | tee "$GITHUB_WORKSPACE/dist/$APK_NAME.sha256"

          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libaicompany_llm.so' || {
            echo "::error::AICompany native library missing"
            exit 1
          }

          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libllama.so' || {
            echo "::error::llama native library missing"
            exit 1
          }

          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libproot.so' || {
            echo "::error::proot native library missing"
            exit 1
          }

          cd "$GITHUB_WORKSPACE/dist"

          zip -q -9 AICompany-debug.zip "$APK_NAME"
          zip -T AICompany-debug.zip

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AICompany-debug-apk
          path: dist/
          retention-days: 14
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AICompany-build-log
          path: build.log
          retention-days: 7
          if-no-files-found: ignore
