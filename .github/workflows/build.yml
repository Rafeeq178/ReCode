name: Build ReCode (Harness) APK

# Repo mein ReCode_Harness_v1.zip (ya v2, v3...) daalo aur main branch pe push karo.
# Workflow sabse high version wali ReCode_Harness_v*.zip ko build karta hai.
# Agar repo mein zip nahi hai to repo ka project folder hi build hota hai.

on:
  workflow_dispatch:
  push:
    branches: [main, master]

env:
  NDK_VERSION: 27.2.12479018   # app/build.gradle.kts mein pinned
  CMAKE_VERSION: 3.22.1        # app/build.gradle.kts mein pinned
  COMPILE_SDK: '37'
  APK_NAME: ReCode-debug.apk

permissions:
  contents: write

concurrency:
  group: build-recode
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Locate project
        shell: bash
        run: |
          set -euo pipefail
          Z=$(ls ./ReCode_Harness_v*.zip 2>/dev/null | sort -V | tail -n1 || true)
          ROOT=.
          if [[ -n "$Z" ]]; then
            echo "Using $Z"
            rm -rf _build_src && mkdir _build_src
            unzip -q -o "$Z" -d _build_src
            ROOT=_build_src
          fi
          S=$(find "$ROOT" -maxdepth 3 -name settings.gradle.kts | head -n1 || true)
          [[ -n "$S" ]] || { echo "::error::settings.gradle.kts nahi mila. ReCode_Harness_vN.zip repo mein daalo."; exit 1; }
          D=$(cd "$(dirname "$S")" && pwd)
          test -f "$D/app/build.gradle.kts"
          echo "PROJECT_DIR=$D" >> "$GITHUB_ENV"
          echo "Project: $D"

      # Fixed key: signing-keys/debug.keystore (zip ke andar hai) taake naya APK purane ke upar install ho.
      - name: Use fixed debug signing key
        shell: bash
        run: |
          if [[ -f "$PROJECT_DIR/signing-keys/debug.keystore" ]]; then
            echo "Using fixed debug keystore"
          else
            echo "::warning::signing-keys/debug.keystore nahi mila - random key, purani app uninstall karni hogi."
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Sirf arm64 build karo: tez hai aur aaj ke phones ke liye kaafi hai.
      - name: Limit to arm64-v8a
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, pathlib
          p = pathlib.Path(os.environ['PROJECT_DIR']) / 'app/build.gradle.kts'
          s = p.read_text()
          s = re.sub(r'abiFilters\s*\+=\s*listOf\([^)]*\)', 'abiFilters += listOf("arm64-v8a")', s)
          p.write_text(s)
          PY
          grep -n "abiFilters" "$PROJECT_DIR/app/build.gradle.kts"

      - name: Install Android SDK parts
        shell: bash
        run: |
          set -euo pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-${COMPILE_SDK}" "platforms;android-36" "build-tools;36.0.0" \
                  "cmake;${CMAKE_VERSION}" "ndk;${NDK_VERSION}" | tail -n 5
          test -d "$ANDROID_HOME/ndk/$NDK_VERSION"

      - name: Install Vulkan shader compiler
        run: sudo apt-get update && sudo apt-get install -y glslc

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Verify APK and prepare downloads
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -name '*.apk' | head -n1)
          test -s "$APK"
          unzip -tq "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          "$BT/apksigner" verify --print-certs "$APK" | grep -E "Verifies|SHA-256" || true
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:|^sdkVersion|^minSdkVersion|^native-code|^application-label:" || true
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/.*\.so' | head -20
          mkdir -p dist
          cp "$APK" "dist/$APK_NAME"
          cd dist
          sha256sum "$APK_NAME" | tee "$APK_NAME.sha256"

      - name: Write release notes
        shell: bash
        run: |
          {
            echo "ReCode (Harness) debug build ${GITHUB_RUN_NUMBER}"
            echo
            echo "- arm64-v8a, offline GGUF (llama.cpp) + API providers"
            echo "- NDK ${NDK_VERSION}"
            echo "- SHA256: $(cut -d' ' -f1 "dist/$APK_NAME.sha256")"
          } > release-notes.md

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReCode-debug
          path: dist/
          retention-days: 14
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: recode-build-${{ github.run_number }}
          name: ReCode debug build ${{ github.run_number }}
          body_path: release-notes.md
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            dist/ReCode-debug.apk
            dist/ReCode-debug.apk.sha256

      - name: Show useful build errors
        if: failure()
        shell: bash
        run: |
          [[ -f build.log ]] || exit 0
          grep -nE 'error:|^e: |FAILED|What went wrong|CMake Error|undefined reference' build.log \
            | cut -c1-260 | head -40 > first-errors.txt || true
          cat first-errors.txt
          { echo '## Build failed - first errors'; echo '```'; cat first-errors.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            first-errors.txt
          retention-days: 7
          if-no-files-found: ignore
