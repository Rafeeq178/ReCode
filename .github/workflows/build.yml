name: Build ReCode (Harness) APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

env:
  NDK_VERSION: 27.2.12479018
  CMAKE_VERSION: 3.22.1
  COMPILE_SDK: '37'
  APK_NAME: ReCode-debug.apk

permissions:
  contents: write

concurrency:
  group: build-recode
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Locate project
        shell: bash
        run: |
          set -euo pipefail
          Z=$(ls ./ReCode_Harness_v*.zip 2>/dev/null | sort -V | tail -n1 || true)
          ROOT=.
          if [[ -n "$Z" ]]; then
            echo "Using $Z"
            rm -rf _build_src && mkdir _build_src
            unzip -q -o "$Z" -d _build_src
            ROOT=_build_src
          fi
          S=$(find "$ROOT" -maxdepth 3 -name settings.gradle.kts | head -n1 || true)
          [[ -n "$S" ]] || { echo "::error::settings.gradle.kts nahi mila."; exit 1; }
          D=$(cd "$(dirname "$S")" && pwd)
          test -f "$D/app/build.gradle.kts"
          echo "PROJECT_DIR=$D" >> "$GITHUB_ENV"
          echo "Project: $D"

      - name: Use fixed debug signing key
        shell: bash
        run: |
          if [[ -f "$PROJECT_DIR/signing-keys/debug.keystore" ]]; then
            echo "Using fixed debug keystore"
          else
            echo "::warning::signing-keys/debug.keystore nahi mila - random key."
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK parts
        shell: bash
        run: |
          set +e
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1
          "$SDKM" "cmake;${CMAKE_VERSION}" "ndk;${NDK_VERSION}" | tail -n 3
          test -d "$ANDROID_HOME/ndk/$NDK_VERSION" || { echo "::error::NDK install nahi hua"; exit 1; }
          test -d "$ANDROID_HOME/cmake/$CMAKE_VERSION" || { echo "::error::CMake install nahi hua"; exit 1; }
          for pkg in "platforms;android-37.0" "platforms;android-37" "platforms;android-36" "build-tools;36.0.0"; do
            "$SDKM" "$pkg" > /dev/null 2>&1 && echo "installed $pkg" || echo "skip $pkg (Gradle download karega)"
          done
          exit 0

      - name: Install Vulkan shader compiler
        run: sudo apt-get update && sudo apt-get install -y glslc

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Verify APK and prepare downloads
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -name '*.apk' | head -n1)
          test -s "$APK"
          unzip -tq "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          "$BT/apksigner" verify --print-certs "$APK" | grep -E "Verifies|SHA-256" || true
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:|^sdkVersion|^minSdkVersion|^native-code|^application-label:" || true
          mkdir -p dist
          cp "$APK" "dist/$APK_NAME"
          cd dist
          sha256sum "$APK_NAME" | tee "$APK_NAME.sha256"

      - name: Write release notes
        shell: bash
        run: |
          {
            echo "ReCode (Harness) debug build ${GITHUB_RUN_NUMBER}"
            echo
            echo "- SHA256: $(cut -d' ' -f1 "dist/$APK_NAME.sha256")"
          } > release-notes.md

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReCode-debug
          path: dist/
          retention-days: 14
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: recode-build-${{ github.run_number }}
          name: ReCode debug build ${{ github.run_number }}
          body_path: release-notes.md
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            dist/ReCode-debug.apk
            dist/ReCode-debug.apk.sha256

      - name: Show useful build errors
        if: failure()
        shell: bash
        run: |
          [[ -f build.log ]] || exit 0
          grep -nE 'error:|^e: |FAILED|What went wrong|CMake Error|undefined reference' build.log \
            | cut -c1-260 | head -40 > first-errors.txt || true
          cat first-errors.txt
          { echo '## Build failed - first errors'; echo '```'; cat first-errors.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            first-errors.txt
          retention-days: 7
          if-no-files-found: ignore
