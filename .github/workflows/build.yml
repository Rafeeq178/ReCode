name: Build ReCode APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

env:
  NDK_VERSION: 27.2.12479018   # pinned in app/build.gradle.kts; without it the native (local model) code is silently dropped
  CMAKE_VERSION: 3.22.1
  APK_NAME: ReCode-debug.apk

permissions:
  contents: write

concurrency:
  group: build-recode
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      # Builds the HIGHEST ReCode_*.zip in the repo (ReCode_phase4.zip beats ReCode_phase3.zip) after unzipping it into
      # a fresh folder. Old AICompany_*.zip files are ignored. With no ReCode zip, the project in the repo is used.
      - name: Locate project
        shell: bash
        run: |
          set -euo pipefail
          Z=$(ls ./ReCode*.zip 2>/dev/null | sort -V | tail -n1 || true)
          ROOT=.
          if [[ -n "$Z" ]]; then
            echo "Using $Z"
            rm -rf _build_src && mkdir _build_src
            unzip -q -o "$Z" -d _build_src
            ROOT=_build_src
          fi
          S=$(find "$ROOT" -maxdepth 3 -name settings.gradle.kts | head -n1 || true)
          [[ -n "$S" ]] || { echo "::error::settings.gradle.kts not found. Put ReCode_*.zip (or the project folder) in the repo."; exit 1; }
          D=$(cd "$(dirname "$S")" && pwd)
          test -f "$D/app/build.gradle.kts"
          chmod +x "$D/gradlew"
          echo "PROJECT_DIR=$D" >> "$GITHUB_ENV"
          echo "Project: $D"

      # A fresh runner makes a NEW random debug key every build, so a new APK cannot be installed over the old one.
      # Keep one fixed debug.keystore in the repo root (or next to settings.gradle.kts).
      - name: Use fixed debug signing key
        shell: bash
        run: |
          set -euo pipefail
          K=""
          for c in "$PROJECT_DIR/debug.keystore" "debug.keystore" "$PROJECT_DIR/signing-keys/debug.keystore"; do
            [[ -f "$c" ]] && { K="$c"; break; }
          done
          if [[ -n "$K" ]]; then
            mkdir -p "$HOME/.android" "$PROJECT_DIR/signing-keys"
            cp "$K" "$HOME/.android/debug.keystore"
            cp "$K" "$PROJECT_DIR/signing-keys/debug.keystore"
            echo "Using fixed debug keystore: $K"
          else
            echo "::warning::debug.keystore not found - APK gets a random signature; uninstall the old app first."
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install NDK, CMake and Vulkan shader compiler
        shell: bash
        run: |
          set -euo pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "cmake;${CMAKE_VERSION}" "ndk;${NDK_VERSION}" | tail -n 3
          # compileSdk 37: install it when sdkmanager already knows it, otherwise Gradle downloads it itself.
          "$SDKM" "platforms;android-37" | tail -n 2 || true
          test -d "$ANDROID_HOME/ndk/${NDK_VERSION}"
          sudo apt-get update -qq && sudo apt-get install -y glslc
          glslc --version | head -n 1

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          test -s "$APK"
          unzip -tq "$APK"
          "$BT/apksigner" verify --print-certs "$APK" | grep -E "Verifies|SHA-256" || true
          "$BT/aapt2" dump badging "$APK" > badging.txt
          grep -E "^package:|^sdkVersion|^targetSdkVersion|^native-code|^application-label:" badging.txt || true
          grep -q "package: name='com.aicompany.app'" badging.txt || { echo "::error::package is not com.aicompany.app (old app keys would not carry over)"; exit 1; }
          grep -q "launchable-activity" badging.txt || { echo "::error::no launcher activity"; exit 1; }
          LIBS=$(unzip -l "$APK" | grep -E 'lib/arm64-v8a/.*\.so' || true)
          echo "$LIBS"
          # If the NDK was not found Gradle drops the native code and the APK still builds: catch that here.
          for need in librecode_local.so librecode_adb.so; do
            echo "$LIBS" | grep -q "$need" || { echo "::error::$need missing - local models would not work"; exit 1; }
          done
          mkdir -p dist
          cp "$APK" "dist/$APK_NAME"
          cp "$PROJECT_DIR"/app/build/outputs/gpuRuntime/debug/*.gz dist/ 2>/dev/null || true
          sha256sum "dist/$APK_NAME" | tee "dist/$APK_NAME.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ReCode-debug
          path: dist/
          retention-days: 14
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: recode-build-${{ github.run_number }}
          name: ReCode debug build ${{ github.run_number }}
          body: "ReCode debug build - package com.aicompany.app"
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            dist/ReCode-debug.apk
            dist/ReCode-debug.apk.sha256

      # Unit tests run after the APK is saved and never block it.
      - name: Run unit tests
        continue-on-error: true
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon :app:testDebugUnitTest 2>&1 | tee "$GITHUB_WORKSPACE/test.log"

      - name: Show useful build errors
        if: failure()
        shell: bash
        run: |
          [[ -f build.log ]] || exit 0
          grep -nE 'error:|fatal error|undefined reference|undeclared|FAILED:|What went wrong|CMake Error|e: file|e: ' build.log \
            | cut -c1-260 | head -60 | tee first-errors.txt || true
          { echo '## Build failed - first errors'; echo '```'; cat first-errors.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            first-errors.txt
          retention-days: 7
          if-no-files-found: ignore
